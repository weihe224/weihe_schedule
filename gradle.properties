org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=false
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Use the AAPT2 that ships with the SDK instead of the one AGP unpacks from
# Maven. On Windows the extracted copy dies with
#   "failed to load XML file: Error 15100 while retrieving message for error 13"
# on the first manifest it parses when its own path contains a space (the
# default install path here, "D:\vibe coding\..."). The byte-identical binary
# works from a space-free directory and every SDK copy works, so the path is
# the trigger, not the binary.
# Backslashes and the drive colon are escaped twice on purpose: once for the
# .properties file format, and once more because Gradle passes the value to
# AGP as a project property (which unescapes a second time). Removing either
# layer reintroduces the failure. Delete this line to fall back to AGP's own
# AAPT2, which reproduces the bug.
android.aapt2FromMavenOverride=D\:\\\\Sdk\\\\build-tools\\\\35.0.0\\\\aapt2.exe
